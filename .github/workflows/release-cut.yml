name: release-cut

# Generalized surface release cut (issue #4455 seam 3, generalizing
# the one-purpose #4213 fix in release-assets.yml): ONE workflow
# cuts any surface release end-to-end -- tag -> build from the
# tag -> release -> asset attach -- executed by the workflow with
# the repo's own token. The desk's hand is read-back only.
#
# Conventions (of record): tag = <surface>-v<version>
# (apk-v0.1.0 precedent); surface releases are prereleases;
# asset names are stable per surface (Obtainium-friendly):
#   apk    -> studysprint.apk
#   webapp -> studysprint-webapp-v<version>.zip
#   tui    -> studysprint-tui-v<version>.zip
# Re-run posture (from #4213): uploads do NOT clobber -- a second
# run over an existing asset fails loudly rather than replacing
# silently. If the tag already exists, the build runs from the
# tag (never from a moved main); if the release already exists,
# creation is skipped and the run only attaches what is missing.

on:
  workflow_dispatch:
    inputs:
      surface:
        description: "Surface to cut"
        type: choice
        options: [apk, webapp, tui]
        required: true
      version:
        description: "Surface version, e.g. 0.1.3 (no leading v)"
        type: string
        required: true
      source_ref:
        description: "Ref to tag when the tag does not exist yet"
        type: string
        default: main
      prerelease:
        description: "Mark the release as a prerelease"
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  cut:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.surface }}-v${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout source ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0

      - name: Ensure the tag exists at the source head
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "tag $TAG already exists -- building from the tag"
          else
            git tag "$TAG"
            git push origin "$TAG"
            echo "tag $TAG created at $(git rev-parse HEAD)"
          fi

      - name: Checkout the tag (the build of record comes from it)
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.surface }}-v${{ inputs.version }}
          path: src

      - name: Set up JDK 17 (apk only)
        if: inputs.surface == 'apk'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK (apk only)
        if: inputs.surface == 'apk'
        run: |
          set -euo pipefail
          # Prefer the runner image's preinstalled SDK when it
          # already carries the packages (no download at all);
          # otherwise download with retries -- a truncated
          # package zip killed the 0.2.0 cut at this step
          # ("Error on ZipFile unknown archive", run
          # 41699794059), so a single attempt is not enough.
          PRE=/usr/local/lib/android/sdk
          if [ -d "$PRE/platforms/android-34" ] && [ -d "$PRE/build-tools/34.0.0" ]; then
            echo "ANDROID_SDK_ROOT=$PRE" >> "$GITHUB_ENV"
            echo "using preinstalled SDK at $PRE"
            exit 0
          fi
          mkdir -p /opt/android-sdk/cmdline-tools
          curl -sSL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdtools.zip -d /opt/android-sdk/cmdline-tools
          mv /opt/android-sdk/cmdline-tools/cmdline-tools /opt/android-sdk/cmdline-tools/latest
          export ANDROID_SDK_ROOT=/opt/android-sdk
          yes | /opt/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          ok=""
          for i in 1 2 3; do
            if /opt/android-sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0"; then ok=1; break; fi
            echo "sdkmanager attempt $i failed -- retrying"
            sleep 5
          done
          [ -n "$ok" ] || { echo "SDK install failed after 3 attempts"; exit 1; }
          echo "ANDROID_SDK_ROOT=/opt/android-sdk" >> "$GITHUB_ENV"

      - name: Core deps for state generation (apk only)
        if: inputs.surface == 'apk'
        run: pip install fsrs genanki

      - name: Write the reader-EPUB generator (tui only)
        if: inputs.surface == 'tui'
        run: |
          cat > "$RUNNER_TEMP/gen_epub.py" <<'PYEOF'
          import sys
          from pathlib import Path
          src = Path(sys.argv[1])
          out = Path(sys.argv[2])
          sys.path.insert(0, str(src))
          import tui
          from study_sr import export_epub
          state = tui.build_state(src)
          receipt = export_epub(
              state["sections"],
              out,
              title=state["plan"].get("course")
              or "StudySprint course",
              surface_version=tui.TUI_VERSION,
              course_note="Sample course bundled with "
                          "StudySprint (synthetic).")
          print("epub receipt:", receipt)
          PYEOF

      - name: Build the artifact from the tag tree
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          case "${{ inputs.surface }}" in
            apk)
              # Reproducible build (#4438): the tag's commit
              # time pins the build clock + zip timestamps, so
              # anyone rebuilding from this tag gets the same
              # bytes (SHA256SUMS + TRUST.md ship with the cut).
              export SOURCE_DATE_EPOCH="$(cd src && git log -1 --format=%ct)"
              echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH" >> "$GITHUB_ENV"
              (cd src && bash android/build.sh)
              cp src/android/studysprint.apk "$GITHUB_WORKSPACE/studysprint.apk"
              ;;
            webapp)
              (cd src/web && zip -qr "$GITHUB_WORKSPACE/studysprint-webapp-v$VERSION.zip" .)
              ;;
            tui)
              (cd src && zip -qr "$GITHUB_WORKSPACE/studysprint-tui-v$VERSION.zip" \
                . -i "*.py" "pyproject.toml" "VERSION" "TUI.md" "README.md" \
                     "requirements.txt" "examples/*" "foundation/*.py" \
                     "tools/*.py" "tests/*.py" "web/build_data.py")
              # The reader edition rides the TUI release as a
              # second asset (#4472): generated from the tag
              # tree's own state, stable-named like the APK.
              # The generator is written by its own step (a
              # heredoc nested in this case branch loses its
              # terminator to YAML indentation -- that syntax
              # error killed the 0.2.0 webapp AND tui cuts,
              # runs 41699805302 / 41699815962). The leg runs
              # only when the tag tree carries export_epub --
              # the 0.2.0 tag predates the eReader build, and
              # coupling the surface cut to a second asset's
              # landing would block the cut itself.
              if grep -q "def export_epub" src/study_sr.py; then
                pip install -q fsrs genanki
                (cd src && python3 "$RUNNER_TEMP/gen_epub.py" "$PWD" "$GITHUB_WORKSPACE/studysprint-reader.epub")
              else
                echo "::warning::export_epub not in this tag tree -- reader EPUB skipped for this cut"
              fi
              ;;
          esac
          ls -la "$GITHUB_WORKSPACE"/studysprint*

      - name: Trust artifacts (apk only)
        if: inputs.surface == 'apk'
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          BT=$ANDROID_SDK_ROOT/build-tools/34.0.0
          cd "$GITHUB_WORKSPACE"
          sha256sum studysprint.apk > SHA256SUMS
          SHA=$(cut -d' ' -f1 SHA256SUMS)
          SIZE=$(stat -c%s studysprint.apk)
          CERT=$("$BT/apksigner" verify --print-certs studysprint.apk \
            | grep "SHA-256 digest" | head -1 | awk '{print $NF}')
          VCODE=$(grep -o 'android:versionCode="[0-9]*"' \
            src/android/AndroidManifest.xml | grep -o '[0-9]*')
          {
            echo "# StudySprint APK — release trust block"
            echo
            echo "- Release: apk-v$VERSION (tag apk-v$VERSION, prerelease surface cut)"
            echo "- Asset: studysprint.apk (stable name — the Obtainium/update channel keys on it)"
            echo "- SHA-256: $SHA"
            echo "- Size: $SIZE bytes"
            echo "- Signer certificate SHA-256: $CERT"
            echo "- versionName $VERSION · versionCode $VCODE"
            echo "- SDK: min 26 · target 34"
            echo "- Permissions declared: none (the shell serves its bundled web app locally; no INTERNET, no device access)"
            echo "- Build clock: SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH (the tag's commit time)"
            echo
            echo "## Verify this download"
            echo
            echo '```'
            echo "sha256sum -c SHA256SUMS"
            echo "apksigner verify --print-certs studysprint.apk   # signer digest must match above"
            echo '```'
            echo
            echo "## Reproduce this build"
            echo
            echo '```'
            echo "git checkout apk-v$VERSION"
            echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH bash android/build.sh"
            echo "sha256sum android/studysprint.apk   # must equal the SHA-256 above"
            echo '```'
          } > TRUST.md
          cat TRUST.md

      - name: Create the release if absent
        env:
          SURFACE: ${{ inputs.surface }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists -- skipping creation"
          else
            PRE=""
            if [ "${{ inputs.prerelease }}" = "true" ]; then PRE="--prerelease"; fi
            gh release create "$TAG" \
              --title "StudySprint $SURFACE v$VERSION" \
              --notes "Surface release $SURFACE v$VERSION, cut by the release-cut workflow (issue #4455 seam 3) from tag $TAG. Changes: see CHANGELOG.md at this tag." \
              $PRE
          fi

      - name: Attach the asset (no clobber -- duplicates fail loudly)
        env:
          SURFACE: ${{ inputs.surface }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          case "$SURFACE" in
            apk)    FILE="studysprint.apk" ;;
            webapp) FILE="studysprint-webapp-v$VERSION.zip" ;;
            tui)    FILE="studysprint-tui-v$VERSION.zip" ;;
          esac
          gh release upload "$TAG" "$GITHUB_WORKSPACE/$FILE"
          if [ "$SURFACE" = "apk" ]; then
            gh release upload "$TAG" \
              "$GITHUB_WORKSPACE/SHA256SUMS" "$GITHUB_WORKSPACE/TRUST.md"
          fi
          if [ "$SURFACE" = "tui" ]; then
            if [ -f "$GITHUB_WORKSPACE/studysprint-reader.epub" ]; then
              gh release upload "$TAG" \
                "$GITHUB_WORKSPACE/studysprint-reader.epub"
            else
              echo "no reader EPUB in this cut -- attach skipped"
            fi
          fi
          gh release view "$TAG" --json tagName,assets \
            --jq '{tag: .tagName, assets: [.assets[].name]}'

      - name: Attest build provenance (apk only)
        if: inputs.surface == 'apk'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ github.workspace }}/studysprint.apk
